<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC｜智慧排班管理平台</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><aside id="sidebar"><div class="brand"><span class="logo">KFC</span><div><b>智慧排班</b><small>營運管理平台 · NEW</small></div></div><nav id="nav"></nav><div class="side-foot">KFC Taiwan · Operations</div></aside><main><header><div><button id="menu" class="mobile">☰</button><span id="breadcrumb">營運管理 / 班表總覽</span></div><div class="head-right"><span id="status" class="pill">尚未連線</span><span id="who"></span><button id="logout" class="ghost" hidden>登出</button></div></header><div id="notice"></div><section id="content"></section></main></div><div id="loginOverlay" class="overlay"><div class="login card"><div class="login-mark">KFC</div><h2>智慧排班管理平台</h2><p>請使用已授權的 Supabase 帳號登入。系統不會載入示範營運資料。</p><form id="loginForm"><label>電子郵件<input type="email" id="email" autocomplete="username" required></label><label>密碼<input type="password" id="password" autocomplete="current-password" required></label><button type="submit" class="primary">登入管理平台</button></form><div id="loginError" class="error"></div><small>員工指休連結採獨立安全入口；目前不開放匿名直接寫入資料。</small></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
