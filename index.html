</style></head><body><header><div><h1>KFC 外送中心｜智慧排班 V8.7</h1><small>正式版完整頁面原型 · OWN TC × 人力需求 × Group × 國定假日 × 促銷</small></div><div><span>測試資料｜未連接 Supabase</span>　<select id="center"><option>新北外送中心</option><option>台北外送中心</option><option>桃園外送中心</option><option>台中外送中心</option><option>台南外送中心</option><option>高雄外送中心</option></select></div></header><nav id="nav"></nav><main><div id="app"></div><p class="foot">本網站為功能與版面測試原型。假日表為內建示範對照，非政府最新公告；TC、員工與促銷均為示範資料。所有編輯僅儲存於此瀏覽器，不代表正式排班。</p></main><script>
const tabs=[['overview','排班總覽'],['week','中心大班表'],['group','Group 階梯排班'],['forecast','TC 需求預測'],['employees','員工管理'],['availability','員工指休'],['holidays','國定假日對照'],['promo','促銷／特殊事件'],['analysis','工時與班表分析'],['settings','系統設定']];const groups=['A','B','C'];const times=Array.from({length:35},(_,i)=>{let m=480+i*30;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});const names=['王小明','周俊宏','鄭冠宇','許心怡','林志偉','黃嘉宏','陳志豪','吳柏翰','張佳玲','李佳穎','劉家豪','蔡明哲'];const starts=[5,5,6,7,8,19,19,20,20,6,8,21],ends=[14,14,15,16,17,28,29,30,30,15,17,31];const restaurants={A:['板橋新埔','板橋雙十','永和中正'],B:['新莊中港','三重正義','蘆洲長榮'],C:['中和景平','新店北新','土城中央']};let today='2026-10-12';let defaults={tab:'overview',date:today,group:'A',weekStart:today,tool:'delivery',employees:names.map((name,i)=>({id:'R'+String(i+1).padStart(3,'0'),name,group:groups[i%3],start:starts[i],end:ends[i],min:3})),assigned:{},promos:[{name:'週末優惠桶',start:'2026-10-17',end:'2026-10-18',scope:'全中心',rate:15}],exceptions:{},forecast:{},manual:{}};let state;try{state={...defaults,...JSON.parse(localStorage.getItem('kfcv7')||'{}')}}catch(e){state=structuredClone(defaults)};let undo=[];const save=()=>{localStorage.setItem('kfcv7',JSON.stringify(state))};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(g,d)=>g+'|'+d;const daykey=(d)=>new Date(d+'T12:00:00').getDay();const plus=(d,n)=>{let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};const weekStart=d=>plus(d,-((daykey(d)+6)%7));const nfmt=x=>Number(x).toFixed(1);function v82LegacyDemand(g,i){let base=i<1?2:i<3?3:i<5?4:i<8?5:i<10?3:i<13?2:i<16?1:i<18?3:i<22?5:i<24?3:1;let mod=g==='B'?((i%4===0)?1:0):g==='C'?((i%5===0)?-1:0):0;return Math.max(0,base+mod)}function tc(g,i){let k=key(g,state.date)+'|'+i;return state.forecast[k]??Math.max(0,Math.round(v82LegacyDemand(g,Math.max(0,i-1))*1.1))}function getRows(g=state.group,d=state.date){let k=key(g,d);return state.assigned[k]||[]}function edit(fn){undo.push(JSON.stringify(state));if(undo.length>30)undo.shift();fn();save();render()}function setTab(t){state.tab=t;save();render()}function setDate(d){if(!d)return;state.date=d;state.weekStart=weekStart(d);save();render()}function setGroup(g){state.group=g;save();render()}function datebar({week=false,group=false}={}){return `<div class="toolbar"><label>日期　<input type="date" value="${state.date}" onchange="setDate(this.value)"></label>${week?`<button onclick="setDate('${plus(state.date,-7)}')">前一週</button><button onclick="setDate('${plus(state.date,7)}')">下一週</button>`:`<button onclick="setDate('${plus(state.date,-1)}')">前一天</button><button onclick="setDate('${plus(state.date,1)}')">下一天</button>`}${group?`<label>Group　<select onchange="setGroup(this.value)">${groups.map(g=>`<option ${g===state.group?'selected':''}>${g}</option>`).join('')}</select></label>`:''}<span class="muted">選擇日期後，本頁直接更新，不需返回總覽</span></div>`}function topCards(){let rows=getRows();let hrs=rows.reduce((s,r)=>s+r.cells.filter(x=>x==='delivery').length*.5,0);let req=times.reduce((s,_,i)=>s+demand(state.group,i),0)*.5;return `<div class="cards"><div class="card">預測 OWN TC<b>${times.reduce((s,_,i)=>s+tc(state.group,i),0)}</b></div><div class="card">需求外送人時<b>${nfmt(req)}h</b></div><div class="card">已排外送工時<b>${nfmt(hrs)}h</b></div><div class="card">運能 TPLH（示意）<b>${hrs?(times.reduce((s,_,i)=>s+tc(state.group,i),0)/hrs).toFixed(2):'—'}</b></div></div>`}function overview(){return `<section class="panel"><h2>排班總覽</h2>${datebar({group:true})}<div class="note">示範資料｜年度 OWN TPLH 目標 2.00；第三方使用率目標 ≤25%。</div>${topCards()}<div class="toolbar"><button class="primary" onclick="setTab('week')">查看中心大班表</button><button onclick="setTab('group')">進入階梯排班</button><button onclick="setTab('forecast')">檢查 TC 預測</button></div></section><section class="panel"><h2>本週排班進度</h2><p>週期：${weekStart(state.date)} ～ ${plus(weekStart(state.date),6)} g">天氣：尚無正式預報</span><span class="tag">需求提前 30 分鐘；未來 30 分鐘 TC 為 0 則需求為 0</span><span class="tag yellow">促銷標記：${state.promos.filter(p=>p.start<=state.date&&p.end>=state.date).map(p=>esc(p.name)).join('、')||'無'}</span></div><div class="toolbar"><button class="primary" onclick="fillDemo()">產生合理班次示範</button><button onclick="addRow()">＋ 新增員工列</button><button onclick="undoStep()">復原 Ctrl+Z</button><span class="muted">工具：</span>${[['delivery','外送'],['break','休息'],['duty','值班'],['meeting','會議'],['training','訓練'],['scheduling','排班作業'],['erase','清除']].map(([id,label])=>`<button class="${state.tool===id?'active':''}" onclick="state.tool='${id}';save();render()">${label}</button>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#329779"></i>已排外送</span><span><i class="dot" style="background:#ffdd55"></i>員工可上班但未排</span><span><i class="dot" style="background:#f4c5c7"></i>人力不足</span><span><i class="dot" style="background:#cde0f8"></i>無姓名需求階梯</span></div><div class="scroll"><div class="schedule"><div class="scell hd rowname">餐廳 / 時段</div>${times.map(t=>`<div class="scell hd">${t}</div>`).join('')}`;restaurants[g].forEach((r,j)=>{html+=`<div class="scell rowname">${r}｜預測 TC</div>${times.map((_,i)=>`<div class="scell">${Math.max(0,Math.round(tc(g,i)*([.4,.35,.25][j])))}</div>`).join('')}`});html+=`<div class="scell hd rowname">Group 需求人數</div>${needs.map((n,i)=>`<div class="scell num ${have[i]<n?'red':'green'}">${n}</div>`).join('')}<div class="scell hd rowname">已排外送人數</div>${have.map((n,i)=>`<div class="scell num ${n<needs[i]?'red':'green'}">${n}</div>`).join('')}<div class="scell hd rowname">人力缺口</div>${have.map((n,i)=>`<div class="scell num ${n<needs[i]?'red':''}">${Math.max(0,needs[i]-n)}</div>`).join('')}<div class="scell hd rowname">建議階梯（無姓名）</div>${times.map(()=>'<div class="scell hd">↓</div>').join('')}`;slots.forEach((row,j)=>{html+=`<div class="scell rowname">建議人力 ${j+1}</div>${row.map(on=>`<div class="scell ${on?'blue':''}">${on?'■':''}</div>`).join const holidays=[['元旦','01-01','01-01','01-01','同節日跨年度優先比較'],['春節','01-29','02-17','02-06','同節日跨年度優先比較'],['和平紀念日','02-28','02-28','02-28','同節日跨年度優先比較'],['兒童節','04-04','04-04','04-04','同節日跨年度優先比較'],['清明節','04-04','04-05','04-05','同節日跨年度優先比較'],['端午節','05-31','06-19','06-09','同節日跨年度優先比較'],['中秋節','10-06','09-25','09-15','同節日跨年度優先比較'],['國慶日','10-10','10-10','10-10','同節日跨年度優先比較'],['光復節','10-25','10-25','10-25','同節日跨年度優先比較']];function holidaysPage(){return `<section class="panel"><h2>國定假日／特殊日期對照</h2><p class="muted">比照你提供的版面：去年／今年／明年，同一節日跨年度優先比對。正式版從政府公告與可維護的年度資料表同步，不要求主管逐筆標記。</p><div class="cards"><div class="card">目前年度<b>2026</b></div><div class="card">國慶日<b>10/10</b></div><div class="card">臺灣光復暨金門古寧頭大捷紀念日<b>10/25</b></div><div class="card">比對方式<b style="font-size:20px">節日對節日</b></div></div><button onclick="alert('測試版內建示範假日資料；正式版將提供政府公告資料同步及來源、更新時間。')">重新載入節日資料（示意）</button><div class="note">此表為介面示範，2025／2026／2027 日期與連假資訊需在正式版依政府最新公告核對，不能直接作為排班法規依據。</div><div class="scroll"><table class="table"><tr><th>特殊日</th><th>2025</th><th>2026</th><th>2027</th><th>預測比對</th></tr>${holidays.map(h=>`<tr><td><b>${h[0]}</b></td><td>2025-${h[1]}</td><td>2026-${h[2]}</td><td>2027-${h[3]}</td><td>${h[4]}</td></tr>`).join('')}</table></div></section>`}function promoPage(){return `<section class="panel"><h2>促銷活動／特殊事件管理</h2>${datebar()}<div class="formgrid"><label>活動名稱<input id="pname" placeholder="例如：優惠桶活動"></label><label>開始日期<input id="pstart" type="date" value="${state.date}"></label><label>結束日期<input id="pend" type="date" value="${state.date}"></label><label>適用範圍<select id="pscope"><option>全中心</option>${groups.map(g=>`<option>Group ${g}</option>`).join('')}</select></label><label>主管確認 TC 成長率（%）<input id="prate" type="number" value="0"></label></div><p><button class="primary" onclick="addPromo()">新增促銷／事件</button></p><div class="scroll"><table class="table"><tr><th>活動</th><th>開始</th><th>結束</th><th>範圍</th><th>TC 成長率</th><th>操作</th></tr>${state.promos.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.start}</td><td>${p.end}</td><td>${p.scope}</td><td>${p.rate}%</td><td><button onclick="edit(()=>state.promos.splice(${i},1))">刪除</button></td></tr>`).join('')}</table></div><div class="note">歷史促銷相似性與系統建議成長率尚未串接；目前是主管手動輸入的測試功能。</div></section>`}function addPromo(){let name=$('pname').value.trim();if(!name)return alert('請輸入活動名稱');let p={name,start:$('pstart').value,end:$('pend').value,scope:$('pscope').value,rate:Number($('prate').value)||0};edit(()=>state.promos.push(p))}function analysisPage(){let h=state.employees.map(e=>({name:e.name,group:e.group,h:getRows(e.group,state.date).filter(r=>r.employee===e.id).reduce((s,r)=>s+r.cells.filter(x=>x&&x!=='break').length*.5,0)}));return `<section class="panel"><h2>工時與班表分析</h2>${datebar({group:true})}${topCards()}<div class="scroll"><table class="table"><tr><th>員工</th><th>Group</th><th>當日已排工時</th><th>每月 28h 目標</th><th>每週 40h 限制</th></tr>${h.map(x=>`<tr><td>${x.name}</td><td>${x.group}</td><td>${nfmt(x.h)}h</td><td>需依整月資料計算</td><td>需依整週資料計算</td></tr>`).join('')}</table></div><div class="note">正式版：月工時依實際班次跨月拆分；工作類型分開統計；OWN TC ÷ 外送工時與 OWN TC ÷ 全部工作工時分開顯示。</div></section>`}function strategyPage(){return `<section class="panel"><h2>營運策略｜每 30 分鐘運能決策</h2>${datebar({group:true})}<div class="scroll"><table class="table"><tr><th>時段</th><th>預測 OWN TC</th><th>需求外送人數</th><th>已排外送人數</th><th>缺口</th><th>策略建議</th></tr>${times.map((t,i)=>{let n=demand(state.group,i),h=getRows().filter(r=>r.cells[i]==='delivery').length;return `<tr><td>${t}</td><td>${tc(state.group,i)}</td><td>${n}</td><td>${h}</td><td>${Math.max(0,n-h)}</td><td>${h<n?'優先補人／檢視跨 Group 支援':'目前人力符合示範需求'}</td></tr>`}).join('')}</table></div></section>`}function settingsPage(){return `<section class="panel"><h2>系統設定與資料管理</h2><div class="cards"><div class="card">年度 OWN TPLH 目標<b>2.00</b></div><div class="card">第三方使用率上限<b>25%</b></div><div class="card">需求提前到班<b>30 分鐘</b></div><div class="card">排班單位<b>30 分鐘</b></div></div><div class="toolbar"><button onclick="exportJSON()">備份測試資料 JSON</button><button class="danger" onclick="if(confirm('確定清除所有本機測試修改？')){localStorage.removeItem('kfcv7');location.reload()}">重設所有示範資料</button></div><p>指休截止固定每週一 18:00（目標週開始前 7 天）。正式版規劃：OP／中心權限、Supabase 伺服器端截止鎖定、雙向同步、排班衝突檢核、資料保留期限及 Excel 匯出。</p></section>`}function exportJSON(){download('kfc-v7-demo.json',JSON.stringify(state,null,2),'application/json')}function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff',content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(){let ds=Array.from({length:7},(_,i)=>plus(weekStart(state.date),i)),csv='員工,Group,日期,工作類型,開始,結束\n';state.employees.forEach(e=>ds.forEach(d=>{let r=(state.assigned[key(e.group,d)]||[]).find(x=>x.employee===e.id);if(!r)return;r.cells.forEach((c,i)=>{if(c)csv+=`${e.name},${e.group},${d},${c},${times[i]},${times[i+1]||'24:00'}\n`})}));download('中心大班表.csv',csv,'text/csv')}function undoStep(){if(!undo.length)return;state=JSON.parse(undo.pop());save();render()}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();undoStep()}});function render(){let nav=$('nav');nav.innerHTML=tabs.map(([id,name])=>`<button class="${state.tab===id?'active':''}" onclick="setTab('${id}')">${name}</button>`).join('');let map={overview,week:weekPage,group:groupPage,forecast:forecastPage,strategy:strategyPage,employees:employeesPage,availability:availabilityPage,holidays:holidaysPage,promo:promoPage,analysis:analysisPage,settings:settingsPage};$('app').innerHTML=map[state.tab]();}
// V7.3 — revised scheduler interactions. All demo data is browser-local.
const v73time=i=>{let m=480+i*30;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const v73num=t=>{let [h,m]=t.split(':').map(Number);return (h<8?h+24:h)*60+m};
const v73end=i=>v73time(i+1);
const v73worked=c=>c&&c!=='break';
function avAllowed(e,d,i){if(!e)return false;let ex=avAvailability(e,d);if(!ex)return false;if(typeof ex[0]==='string')ex=[ex];let a=v73num(v73time(i)),b=v73num(v73end(i));return ex.some(w=>a>=v73num(w[0])&&b<=v73num(w[1]))}
function v73all(d=state.date){let a=[];for(const g of groups)for(const [j,r] of getRows(g,d).entries())if(r.employee)a.push({g,j,r});return a}
function v73conflict(emp,d,i,excludeG,excludeJ){return v73all(d).some(x=>x.r.employee===emp&&!(x.g===excludeG&&x.j===excludeJ)&&v73worked(x.r.cells[i]))}
function v73select(j,id){let g=state.group,d=state.date,rows=getRows(g,d),old=rows[j];if(id&&rows.some((r,k)=>k!==j&&r.employee===id)){alert('此員工已在本 Group 排班');return}if(id&&old.cells.some((v,i)=>v73worked(v)&&v73conflict(id,d,i,g,j))){alert('此員工與其他 Group 的班次時間重疊，請先調整班次');return}edit(()=>{old.employee=id;if(!id)old.cells=times.map(()=>'');else if(!old.cells.some(v73worked)){let e=getEmployee(id);old.cells=times.map((_,i)=>avAllowed(e,d,i)&&i>=e.start&&i<Math.min(e.end,e.start+8)?'delivery':'')}})}
function v73paint(j,i){let r=getRows()[j];if(!r?.employee){alert('請先選擇員工');return}let next=r.cells[i]===state.tool?'':state.tool;if(state.tool==='erase')next='';if(v73worked(next)&&v73conflict(r.employee,state.date,i,state.group,j)){alert('禁止同一員工同時段跨 Group 重疊排班');return}edit(()=>r.cells[i]=next)}
function v73fill(){let g=state.group,d=state.date,existing=getRows(g,d),covered=times.map((_,i)=>existing.filter(r=>r.cells[i]==='delivery').length),pool=state.employees.filter(e=>!existing.some(r=>r.employee===e.id));let made=[];
// Shift-oriented heuristic: continuous 3-5h blocks; never fills a whole day with one person.
for(let round=0;round<pool.length;round++){
 let best=null;
 for(const e of pool){if(made.some(x=>x.employee===e.id))continue;
  for(let st=0;st<times.length;st++)for(let len=6;len<=10;len++){
   if(st+len>times.length)continue;
   let ok=true,score=0;
   for(let i=st;i<st+len;i++){if(!avAllowed(e,d,i)||v73conflict(e.id,d,i,g,-1)){ok=false;break}score+=Math.max(0,demand(g,i)-covered[i])*(i>=5&&i<12||i>=19&&i<27?1.5:1)}
   if(ok&&score>0&&(!best||score/(len*.5+2)>best.ratio))best={e,st,len,score,ratio:score/(len*.5+2)};
  }
 }
 if(!best)break;
 let cells=times.map((_,i)=>i>=best.st&&i<best.st+best.len?'delivery':'');made.push({employee:best.e.id,cells});for(let i=best.st;i<best.st+best.len;i++)covered[i]++;
 if(covered.every((v,i)=>v>=demand(g,i)))break;
}
 edit(()=>state.assigned[key(g,d)]=[...existing,...made]);
}
function v73groupPage(){let g=state.group,d=state.date,rows=getRows(),need=times.map((_,i)=>demand(g,i)),have=times.map((_,i)=>rows.filter(r=>r.cells[i]==='delivery').length);
let html=`<section class="panel"><h2>Group ${g}｜階梯排班與餐廳 TC</h2>${datebar({group:true})}<div class="note">時間軸 08:00–隔日 01:00；需求提前 30 分鐘；未來 30 分鐘 TC 為 0 則需求為 0。主管可手動跨 Group 排班，<b>只禁止同一員工同一時段重疊</b>。建議班次採連續時段，不再堆疊整日色塊。</div><div class="toolbar"><button class="primary" onclick="v73fill()">示範：補足連續班次</button><button onclick="addRow()">＋ 新增排班列</button><button onclick="undoStep()">復原 Ctrl+Z</button><span class="muted">直接點格子：</span>${[['delivery','外送'],['break','休息'],['duty','值班'],['meeting','會議'],['training','訓練'],['scheduling','排班作業'],['erase','清除']].map(([k,n])=>`<button class="${state.tool===k?'active':''}" onclick="state.tool='${k}';save();render()">${n}</button>`).join('')}</div><div class="legend"><span>🟩 已排外送</span><span>🟨 可上班但未排</span><span>🟥 人力缺口</span><span>⬜ 不可排班／空白</span></div><div class="scroll v76-scroll"><div class="schedule v76-schedule" style="grid-template-columns:225px repeat(${times.length},64px)"><div class="scell hd rowname">餐廳／時段</div>${times.map(t=>`<div class="scell hd">${t}</div>`).join('')}`;
restaurants[g].forEach((name,j)=>{html+=`<div class="scell rowname">${name} TC</div>${times.map((_,i)=>`<div class="scell">${Math.round(tc(g,i)*[.4,.35,.25][j])}</div>`).join('')}`});
for(const [title,vals,cls] of [['需求人數',need,(_,i)=>have[i]<need[i]?'red':'green'],['已排外送',have,(_,i)=>have[i]<need[i]?'red':'green'],['人力缺口',need.map((n,i)=>Math.max(0,n-have[i])),(n)=>n?'red':'']])html+=`<div class="scell hd rowname">${title}</div>${vals.map((n,i)=>`<div class="scell num ${cls(n,i)}">${n}</div>`).join('')}`;
rows.forEach((r,j)=>{let e=getEmployee(r.employee);html+=`<div class="scell rowname"><select onchange="v73select(${j},this.value)"><option value="">選擇員工</option>${state.employees.filter(x=>(x.group===g||x.id===r.employee)&&!rows.some((y,k)=>k!==j&&y.employee===x.id)).map(x=>`<option value="${x.id}" ${r.employee===x.id?'selected':''}>${esc(x.name)} (${x.group})</option>`).join('')}</select></div>${times.map((t,i)=>{let c=r.cells[i],avail=e&&avAllowed(e,d,i),bad=c&&v73worked(c)&&v73conflict(r.employee,d,i,g,j);return `<div title="${t}–${v73end(i)} ${e?esc(e.name):''}" onclick="v73paint(${j},${i})" class="scell ${bad?'red':c==='delivery'?'green':c==='break'?'break':c?'other':avail?'yellow':''}">${bad?'⚠':c==='delivery'?'外送':c==='break'?'休':c?({'duty':'值班','meeting':'會議','training':'訓練','scheduling':'排班'}[c]):avail?'+':'·'}</div>`}).join('')}`});

 for(const table of SB_TABLES){
   try{
     const {data,res}=await sbRequest('/rest/v1/'+encodeURIComponent(table)+'?select=*&limit=1',{method:'GET'});
     const row=Array.isArray(data)?data[0]:null;
     sbResults.push({table,ok:true,columns:row?Object.keys(row):[],rows:Array.isArray(data)?data.length:0,note:row?'成功讀取 1 筆':'可查詢，但沒有回傳資料；無法確認欄位（可能為空表或 RLS 篩選）'});
   }catch(e){sbResults.push({table,ok:false,columns:[],rows:0,note:e.message})}
   sbRefresh();
 }
 const ok=sbResults.filter(x=>x.ok).length;
 sbMessage='完成：'+ok+'/'+SB_TABLES.length+' 張資料表查詢成功。成功不代表所有資料均可讀取；需再核對 RLS。';sbRefresh();
}
function sbCopyReport(){
 const report={checked_at:new Date().toISOString(),project:SB_URL,results:sbResults.map(x=>({table:x.table,query_ok:x.ok,columns:x.columns,note:x.note}))};
 const content=JSON.stringify(report,null,2);
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(content).then(()=>alert('已複製檢查結果（不含帳密與金鑰）')).catch(()=>download('supabase-schema-check.json',content,'application/json'));
 else download('supabase-schema-check.json',content,'application/json');
}
function sbPanel(){return `<section class="panel"><h2>Supabase 資料庫連線｜唯讀檢查</h2><div class="note">專案：${sbEscape(SB_URL)}。使用 Publishable Key + Supabase Auth 登入；不使用 Secret Key。此版本只查詢，不新增、修改或刪除資料。</div><p><b id="sb-status">${sbEscape(sbMessage)}</b></p><div class="toolbar"><label>登入 Email <input id="sb-email" type="email" autocomplete="username" placeholder="Supabase Auth 帳號" value="${sbEscape(sbSession?.email||'')}"></label><label>密碼 <input id="sb-password" type="password" autocomplete="current-password" placeholder="密碼不會儲存"></label><button class="primary" onclick="sbSignIn()">登入</button><button onclick="sbSignOut()">登出</button></div><div class="toolbar"><button class="primary" onclick="sbCheck()" ${sbSession?'':'disabled'}>檢查 15 張資料表（唯讀）</button><button onclick="sbCopyReport()" ${sbResults.length?'':'disabled'}>複製檢查結果</button></div><div id="sb-table-results">${sbResultHtml()}</div><p class="muted">重要：查詢成功只代表目前登入身分可讀取。尚未確認資料欄位與餐廳／Group mapping 前，排班頁的 TC 仍是測試資料，不會冒充真實資料。</p></section>`}
function sbResultHtml(){if(!sbResults.length)return '<p class="muted">尚無資料表檢查結果。</p>';return `<div class="scroll"><table class="table"><thead><tr><th>資料表</th><th>狀態</th><th>回傳欄位</th><th>備註</th></tr></thead><tbody>${sbResults.map(r=>`<tr><td>${sbEscape(r.table)}</td><td>${r.ok?'查詢成功':'失敗'}</td><td style="max-width:330px;overflow-wrap:anywhere">${sbEscape(r.columns.join(', ')||'—')}</td><td>${sbEscape(r.note)}</td></tr>`).join('')}</tbody></table></div>`}
function sbRefresh(){if(state.tab==='settings'){const node=document.getElementById('sb-settings');if(node)node.innerHTML=sbPanel()}}
const sbOriginalSettings=v73settings;
v73settings=function(){let base='';try{base=sbOriginalSettings()}catch(e){console.error('設定頁基礎內容錯誤',e);base='<section class="panel"><h2>系統設定</h2><p>原設定區塊無法載入，資料庫檢查仍可使用。</p></section>'}return base+'<div id="sb-settings">'+sbPanel()+'</div>'};
const sbOriginalRender=render;
render=function(){
 try { sbOriginalRender(); }
 catch(err){
  console.error('智慧排班頁面載入失敗',err);
  const app=document.getElementById('app');
  if(app)app.innerHTML='<section class="panel" style="background:white;padding:24px"><h2>頁面載入發生錯誤</h2><p>已保留現有資料，請切換其他頁籤或重新整理。錯誤資訊：</p><pre style="white-space:pre-wrap;color:#b42318">'+sbEscape(err?.message||err)+'</pre><button onclick="setTab(\'settings\')">前往系統設定</button></section>';
 }
 const badge=document.getElementById('sb-connection-badge');
 if(badge)badge.textContent=sbSession?'Supabase 已登入｜資料表待核對':'測試資料｜Supabase 未登入';
};
const headerBadge=document.querySelector('header span');if(headerBadge)headerBadge.id='sb-connection-badge';
render();
</script></body></html>
